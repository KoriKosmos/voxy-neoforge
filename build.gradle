plugins {
    id 'net.neoforged.moddev' version "2.0.42-beta"
    id 'maven-publish'
}

def isInGHA = System.getenv("GITHUB_ACTIONS") == "true"

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "CaffeineMC"
                url = "https://maven.caffeinemc.net/releases"
            }
        }
        filter {
            includeGroup "net.caffeinemc"
        }
    }
}


def gitCommitHash = { ->
    try {
        ExecOutput result = providers.exec {
            commandLine = ['git', 'rev-parse', '--short', 'HEAD']
            ignoreExitValue = true
        }

        if (result.getResult().get().getExitValue() != 0) {
            return "<UnknownCommit>";
        } else {
            return result.standardOutput.asText.get().strip();
        }
    } catch (Exception e) {
        e.printStackTrace()
        return "<UnknownCommit>";
    }
}

def buildtime = {System.currentTimeSeconds()}

processResources {
    def time = buildtime()
    def hash = gitCommitHash()
    def version = project.version

    inputs.properties("version": version, "commit": hash, "buildtime": time)
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": version, "commit": hash, "buildtime": time
    }

    // Exclude leftover Fabric metadata from NeoForge build
    exclude 'fabric.mod.json'
    exclude 'voxy.accesswidener'
}

neoForge {
    version = project.neoforge_version

    // Validate access transformers at build time to catch invalid targets
    validateAccessTransformers = true

    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    // Group classes and resources into one mod file in dev, otherwise only build/resources is
    // treated as the voxy mod and mixin/plugin classes cannot be found
    mods {
        voxy {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
        }
    }

    parchment {
        minecraftVersion = project.minecraft_version
        mappingsVersion = "2024.11.17"
    }
}

def modRuntimeOnlyMsk = {arg->}
if (!isInGHA) {
    modRuntimeOnlyMsk = { arg ->
        dependencies {
            modRuntimeOnly(arg)
        }
    }
}

configurations {
    // Mods only needed to run the dev client. JarJar container jars (like Sodium's) are not
    // discovered from the classpath, so they are copied into run/mods like a real install
    devRuntimeMods { transitive = false }
}

tasks.register('copyDevRuntimeMods', Sync) {
    from configurations.devRuntimeMods
    into layout.projectDirectory.dir('run/mods')
}

tasks.matching { it.name == 'runClient' }.configureEach {
    dependsOn 'copyDevRuntimeMods'
}

dependencies {
    // To change the versions see the gradle.properties file
    implementation "net.neoforged:neoforge:${project.neoforge_version}"

    // Sodium 0.8 for NeoForge (required, provides the config API used by VoxyConfigMenu)
    // The Modrinth jar is a JarJar container, so compile against the inner mod jar from CaffeineMC's maven
    compileOnly("net.caffeinemc:sodium-neoforge-mod:${project.sodium_maven_version}") { transitive = false }
    devRuntimeMods "maven.modrinth:sodium:${project.sodium_version}"

    // Optional integrations, compiled against but not required at runtime
    compileOnly "maven.modrinth:lithium:${project.lithium_version}"
    compileOnly "maven.modrinth:iris:${project.iris_version}"
    compileOnly "maven.modrinth:vivecraft:${project.vivecraft_version}"
    compileOnly "maven.modrinth:chunky:${project.chunky_version}"
}


def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
    it.options.deprecation = true
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }

    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.


    //withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}"}
    }
}

// Validate mixin configuration (registration, exclusions, remap flags)
task validateMixinConfig(type: Exec) {
    description = 'Validates mixin registration, exclusions, and configuration'
    group = 'verification'

    commandLine 'python3', 'scripts/validate_mixin_config.py'

    // Only run if script exists
    onlyIf {
        file('scripts/validate_mixin_config.py').exists()
    }
}

// Validate mixin target signatures before compilation
task validateMixinSignatures(type: Exec) {
    description = 'Validates @Inject/@Shadow targets against Minecraft source'
    group = 'verification'

    commandLine 'python3', 'scripts/validate_mixin_targets.py'

    // Only run if script and MC sources exist
    onlyIf {
        file('scripts/validate_mixin_targets.py').exists() &&
        file('.reference/minecraft/1.21.1/decompiled').exists()
    }

    // Ignore failures if sources not available or script has issues (optional validation)
    ignoreExitValue = true
}

// Validate mixin configurations after JAR creation
task validateMixins(type: Exec) {
    dependsOn jar

    description = 'Validates that all mixins declared in JSON configs are present in the JAR'
    group = 'verification'

    commandLine 'bash', 'scripts/validate_mixins.sh'

    // Only run if script exists
    onlyIf {
        file('scripts/validate_mixins.sh').exists()
    }
}

// Run validations as part of build process
compileJava.dependsOn validateMixinConfig       // Before compilation (config check)
compileJava.dependsOn validateMixinSignatures   // Before compilation (signature check)
build.dependsOn validateMixins                   // After JAR creation (content check)



