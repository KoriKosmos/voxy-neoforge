modLoader="javafml"
loaderVersion="[4,)"
license="All-Rights-Reserved"
issueTrackerURL="https://github.com/MCRcortex/voxy/issues"

[[mods]]
modId="voxy"
version="${version}"
displayName="Voxy"
description="Far distance rendering mod utilising LoDs"
authors="Cortex"
logoFile="assets/voxy/icon.png"
# Voxy is client side only, dont require it on servers
displayTest="IGNORE_ALL_VERSION"

[modproperties.voxy]
commit="${commit}"
buildtime="${buildtime}"

[[dependencies.voxy]]
modId="neoforge"
type="required"
versionRange="[21.1.82,)"
ordering="NONE"
side="BOTH"

[[dependencies.voxy]]
modId="minecraft"
type="required"
versionRange="[1.21.1]"
ordering="NONE"
side="BOTH"

[[dependencies.voxy]]
modId="sodium"
type="required"
versionRange="[0.8.13,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.voxy]]
modId="voxyworldgenv2"
type="incompatible"
reason="Voxy World Gen V2 2.2.2 is broken with this version of Voxy"
versionRange="[2.2.2]"
ordering="NONE"
side="BOTH"

[[mixins]]
config="client.voxy.mixins.json"

[[mixins]]
config="common.voxy.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"
